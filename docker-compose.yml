version: "3.8"

services:
  # ============================================================================
  # Microsoft SQL Server 2022 (Developer Edition for local simulation)
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fee_management_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-LocalDevSecret123!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/init-scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fee_network

  # ============================================================================
  # Mailpit - Local email testing and SMTP catch-all with Web UI
  # Web UI accessible at http://localhost:8025
  # SMTP server accessible at localhost:1025
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: fee_management_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      - MP_MAX_MESSAGES=1000
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit_data:/data
    networks:
      - fee_network

volumes:
  sqlserver_data:
    driver: local
  mailpit_data:
    driver: local

networks:
  fee_network:
    driver: bridge

